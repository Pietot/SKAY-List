name: Update Extreme Demon Points

on:
    schedule:
        - cron: "0 2 * * *"
    workflow_dispatch:

jobs:
    update-points:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install requests

            - name: Refresh extreme demon points
              run: python update_extreme_points.py
